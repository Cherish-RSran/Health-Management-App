<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>家庭健康档案 · 交互 Demo</title>
<style>
:root{
  --brand:#0E9F6E; --brand-2:#E7F6F0; --brand-3:#0B8057;
  --bg:#F4F6F8; --card:#fff;
  --text:#16191F; --t2:#6B7280; --t3:#9CA3AF;
  --line:#EEF1F4; --line2:#E4E8ED;
  --orange:#F97316; --blue:#3B82F6; --purple:#8B5CF6;
  --cyan:#06B6D4; --green:#22C55E; --red:#EF4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#F7FAFC,#E4E9EF 70%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:28px 16px;color:var(--text);-webkit-font-smoothing:antialiased;
}
.phone{
  width:390px;height:812px;background:var(--bg);border-radius:46px;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 11px #14171C,0 0 0 13px #34393F,0 40px 80px rgba(16,24,40,.30);
}
.statusbar{height:46px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:600;letter-spacing:.2px}
.statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
.navbar{height:44px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;position:sticky;top:0;z-index:12;padding:0 90px;background:var(--bg)}
.navbar .title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .back{position:absolute;left:18px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--text);line-height:1;cursor:pointer}
.capsule{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:78px;height:30px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);
  border-radius:16px;display:flex;align-items:center;justify-content:space-around;backdrop-filter:blur(6px)}
.capsule i{width:14px;height:14px;display:block;opacity:.55}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.page{padding-bottom:16px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.phone-inner{position:absolute;top:46px;left:0;right:0;bottom:0;background:var(--bg);
  display:flex;flex-direction:column;z-index:50;animation:slideIn .24s cubic-bezier(.22,.8,.3,1)}
@keyframes slideIn{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
.phone-inner .navbar{background:var(--bg)}
.card{background:var(--card);border-radius:14px;margin:10px 14px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec-title .bar{width:3px;height:14px;border-radius:2px;background:var(--brand)}
.sec-title .more{font-size:12px;color:var(--t3)}
.muted{color:var(--t3);font-size:12px}
.hr{height:1px;background:var(--line);margin:11px -14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;
  font-size:11.5px;font-weight:500;line-height:1.5}
.hero{padding:2px 18px 6px;display:flex;align-items:center;justify-content:space-between}
.hero .fam{font-size:20px;font-weight:700;letter-spacing:-.2px}
.hero .sub{font-size:12px;color:var(--t3);margin-top:3px}
.invite{padding:7px 13px;border-radius:20px;background:var(--brand-2);color:var(--brand-3);
  font-size:12.5px;font-weight:600;cursor:pointer}
.avatars{display:flex;gap:14px;padding:10px 18px 4px;overflow-x:auto;scrollbar-width:none}
.avatars::-webkit-scrollbar{display:none}
.av{flex:0 0 auto;width:52px;text-align:center;cursor:pointer}
.av .b{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:600;margin:0 auto;box-shadow:0 3px 8px rgba(16,24,40,.14);transition:.18s}
.av.sel .b{outline:2.5px solid var(--brand);outline-offset:2px}
.av .n{font-size:11.5px;color:var(--t2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av .n.on{color:var(--brand);font-weight:600}
.med-person{padding:2px 0}
.med-person .ph{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.med-person .ph b{font-size:14px}
.med-person .ph span{font-size:11.5px;color:var(--t3)}
.slot{display:flex;gap:10px;align-items:flex-start;padding:5px 0 5px 4px}
.slot .tag{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--brand-2);
  color:var(--brand-3);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.slot .tag.noon{background:#FFF6E5;color:#B45309}
.slot .tag.eve{background:#EEF0FF;color:#4F46E5}
.pill{padding:4px 10px;border-radius:8px;background:#F7F9FB;border:1px solid var(--line);
  font-size:12.5px;display:inline-flex;align-items:baseline;gap:5px;margin:0 5px 5px 0}
.pill em{font-style:normal;color:var(--t3);font-size:11px}
.todo{display:flex;align-items:center;gap:11px;padding:9px 0}
.todo .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.todo .tx{flex:1;min-width:0}
.todo .tx b{font-size:13.5px;font-weight:500;display:block}
.todo .tx b.done{text-decoration:line-through;color:var(--t3)}
.todo .tx span{font-size:11.5px;color:var(--t3)}
.todo .due{font-size:12px;font-weight:600;white-space:nowrap;text-align:right}
.due.warn{color:var(--orange)} .due.bad{color:var(--red)} .due.ok{color:var(--t3)}
.todo .act{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3);
  flex:0 0 auto;cursor:pointer}
.todo .act.on{background:var(--brand);border-color:var(--brand);color:#fff}
.filters{background:var(--card);padding:8px 0 10px;position:sticky;top:44px;z-index:11;
  box-shadow:0 1px 0 var(--line)}
.frow{display:flex;gap:7px;padding:4px 14px;overflow-x:auto;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.f{padding:5.5px 12px;border-radius:20px;font-size:12.5px;background:#F2F5F8;color:var(--t2);
  white-space:nowrap;cursor:pointer;transition:.16s;border:1px solid transparent}
.f.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(14,159,110,.28)}
.searchwrap{padding:10px 14px 2px}
.search{display:flex;align-items:center;gap:8px;background:#F2F5F8;border-radius:11px;padding:9px 12px}
.search svg{width:16px;height:16px;flex:0 0 auto;opacity:.45}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:14px;
  font-family:inherit;color:var(--text)}
.search input::placeholder{color:#B6BDC6}
.tl{margin:8px 14px;background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tl-month{padding:12px 18px 4px;font-size:12px;color:var(--t3);font-weight:600;letter-spacing:.4px}
.ev{display:flex;gap:11px;padding:12px 14px;position:relative;cursor:pointer;transition:background .15s}
.ev:active{background:#FAFBFC}
.ev + .ev{border-top:1px solid var(--line)}
.ev.on{background:linear-gradient(90deg,#FFF7F0,#fff 65%)}
.ev.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:0 3px 3px 0;background:var(--orange)}
.badge{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700}
.ev .body{flex:1;min-width:0}
.ev .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ev .r1 b{font-size:14.5px;font-weight:600}
.ev .r2{font-size:12px;color:var(--t3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .r2 .who{color:var(--t2)}
.ev .arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#CBD2DA;font-size:17px}
.ongoing{background:var(--orange);color:#fff;font-size:10.5px;padding:1.5px 6px;border-radius:5px;font-weight:600}
.fab{position:absolute;right:18px;bottom:78px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(140deg,#12B57C,#0B8057);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:27px;font-weight:300;box-shadow:0 8px 22px rgba(14,159,110,.42);
  cursor:pointer;z-index:20;transition:.18s;line-height:1}
.fab:active{transform:scale(.93)}
.pcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;
  margin:10px 14px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);cursor:pointer}
.pcard:active{background:#FAFBFC}
.pcard .b{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:600;flex:0 0 auto}
.pcard .i{flex:1;min-width:0}
.pcard .i b{font-size:15.5px}
.pcard .i p{margin:4px 0 0;font-size:12px;color:var(--t3)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tg{font-size:11px;padding:2px 7px;border-radius:6px;background:#F2F5F8;color:var(--t2)}
.tg.al{background:#FEF0EE;color:#C2410C}
.tg.ch{background:#EEF2FF;color:#4338CA}
.tg.md{background:#E9F7F1;color:#0B8057}
.tg.su{background:#F5F3FF;color:#6D28D9}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:12px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.16s;border:none}
.btn:active{transform:scale(.985)}
.btn.sm{height:38px;font-size:13.5px;border-radius:10px}
.btn.primary{background:linear-gradient(140deg,#12B57C,#0B8057);color:#fff;
  box-shadow:0 6px 16px rgba(14,159,110,.3)}
.btn.ghost{background:#fff;color:var(--brand-3);border:1.5px solid var(--brand-2)}
.btn.plain{background:#F2F5F8;color:var(--t2)}
.btn.wide{margin:0 14px}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step .rail{flex:0 0 auto;width:22px;display:flex;flex-direction:column;align-items:center}
.step .pt{width:11px;height:11px;border-radius:50%;background:var(--brand);margin-top:4px;
  box-shadow:0 0 0 3px var(--brand-2)}
.step.empty .pt{background:#fff;border:2px solid var(--line2);box-shadow:none}
.step.alert .pt{background:var(--red);box-shadow:0 0 0 3px #FDE8E8}
.step .line{flex:1;width:2px;background:var(--line);margin-top:4px}
.step .c{flex:1;min-width:0}
.step .d{font-size:11.5px;color:var(--t3);font-weight:600;display:flex;gap:7px;align-items:center}
.step .txt{font-size:13.5px;margin-top:4px;line-height:1.55}
.step .txt .sev{font-size:11px;padding:1.5px 6px;border-radius:5px;margin-left:6px;font-weight:600}
.sev.s1{background:#FEF6E7;color:#B45309}
.sev.s2{background:#FFEDE4;color:#C2410C}
.sev.s3{background:#FDE8E8;color:#B91C1C}
.step.empty .txt{color:#B6BDC6}
.step .edit{font-size:11px;color:var(--t3);margin-top:6px;cursor:pointer}
.temp{display:inline-flex;align-items:center;gap:4px;background:#FDE8E8;color:#B91C1C;
  font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px}
.photo{width:76px;height:76px;border-radius:10px;margin-top:8px;cursor:pointer;
  background:linear-gradient(135deg,#E9EDF2,#D7DEE6);display:flex;align-items:center;
  justify-content:center;font-size:10.5px;color:var(--t3);border:1px solid var(--line2)}
.kv{display:flex;gap:10px;padding:8px 0;font-size:13px;align-items:flex-start}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{flex:0 0 62px;color:var(--t3);font-size:12.5px}
.kv .v{flex:1;line-height:1.6;min-width:0}
.kv .v .ed{float:right;color:var(--brand-3);font-size:11.5px;cursor:pointer}
.row{display:flex;align-items:center;gap:11px;padding:13px 0;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600;flex:0 0 auto}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:14.5px;font-weight:500;display:block}
.row .tx span{font-size:11.5px;color:var(--t3);display:block;margin-top:3px}
.row .go{color:#CBD2DA;font-size:17px}
.addline{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 0;
  font-size:13px;color:var(--brand-3);font-weight:600;cursor:pointer;border-top:1px dashed var(--line2)}
.sw{width:46px;height:27px;border-radius:15px;background:#DFE4EA;position:relative;
  transition:.2s;flex:0 0 auto;cursor:pointer}
.sw.on{background:var(--brand)}
.sw i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sw.on i{left:21.5px}
.fld{margin-bottom:16px}
.fld>label{display:block;font-size:12.5px;color:var(--t3);font-weight:600;margin-bottom:8px}
.fld .req{color:var(--red)}
.fld input,.fld textarea{width:100%;border:1px solid var(--line2);border-radius:10px;
  padding:10px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--text)}
.fld input:focus,.fld textarea:focus{border-color:var(--brand)}
.fld textarea{resize:none;height:72px;line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:10px;background:#F4F6F8;font-size:13.5px;cursor:pointer;
  border:1.5px solid transparent;transition:.15s}
.opt.on{background:var(--brand-2);border-color:var(--brand);color:var(--brand-3);font-weight:600}
.doc{position:absolute;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;
  animation:slideUp .26s cubic-bezier(.22,.8,.3,1)}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.doc-hd{flex:0 0 auto;padding:12px 18px 14px;border-bottom:1.5px solid #16191F}
.doc-hd .t{font-size:12px;color:var(--t3);letter-spacing:1.2px;font-weight:600}
.doc-hd .n{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
.doc-hd .m{font-size:13px;color:var(--t2);margin-top:4px}
.doc-bd{flex:1;overflow-y:auto;padding:16px 18px 22px;scrollbar-width:none}
.doc-bd::-webkit-scrollbar{display:none}
.dsec{padding:12px 0}
.dsec + .dsec{border-top:1px solid var(--line)}
.dsec .lb{font-size:12px;color:var(--t3);font-weight:700;letter-spacing:.6px;margin-bottom:7px}
.dsec .ct{font-size:16px;line-height:1.62}
.allergy{background:#FEF2F2;border:1px solid #FBD5D5;border-radius:10px;padding:11px 13px;margin:0 -5px}
.allergy .lb{color:#B91C1C !important}
.allergy .ct{color:#B91C1C;font-size:18px;font-weight:650}
.dline{font-size:16px;line-height:1.75}
.doc-ft{flex:0 0 auto;padding:12px 18px;border-top:1px solid var(--line);
  background:#fff;display:flex;gap:10px}
.sheet-body{width:100%;max-height:86%;background:#fff;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;animation:up .3s cubic-bezier(.22,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-bd{flex:1;overflow-y:auto;padding:16px 18px;scrollbar-width:none}
.sheet-bd::-webkit-scrollbar{display:none}
.sheet-ft{flex:0 0 auto;padding:12px 18px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.steps-bar{display:flex;gap:5px;padding:0 18px 12px}
.steps-bar i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.steps-bar i.on{background:var(--brand)}
.actions{position:absolute;inset:0;background:rgba(16,24,40,.42);z-index:80;
  display:flex;align-items:flex-end;animation:fade .16s}
.actions .box{width:100%;background:#fff;border-radius:18px 18px 0 0;overflow:hidden;animation:up .24s;
  padding-bottom:14px}
.actions .it{padding:16px;text-align:center;font-size:15.5px;border-bottom:1px solid var(--line);cursor:pointer}
.actions .it.danger{color:var(--red)}
.actions .it.cancel{color:var(--t2);border-bottom:none;margin-top:8px;background:#F7F9FB;font-weight:600}
.pend{display:flex;align-items:center;gap:11px;padding:13px 0}
.pend+.pend{border-top:1px solid var(--line)}
.pend .b{width:42px;height:42px;border-radius:50%;background:#EEF2F7;color:#5B6672;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:0 0 auto}
.mini-btn{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;
  flex:0 0 auto}
.mini-btn.ok{background:var(--brand);color:#fff}
.mini-btn.no{background:#F2F5F8;color:var(--t2)}
.logitem{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
.logitem:first-child{border-top:none;padding-top:4px}
.logitem .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.logitem .tx{flex:1;min-width:0;font-size:13px;line-height:1.6}
.logitem .tx .w{color:var(--t3);font-size:11.5px;margin-top:3px}
.emg{background:linear-gradient(150deg,#fff 40%,#FFF5F5);border:1.5px solid #FBD5D5}
.emg-hd{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:#B91C1C}
.emg-line{display:flex;gap:9px;font-size:13px;padding:8px 0;border-top:1px solid #FBE3E3}
.emg-line .k{flex:0 0 70px;color:#C97B7B;font-size:12px}
.viewer{position:absolute;inset:0;background:rgba(8,10,14,.94);z-index:95;
  display:flex;flex-direction:column;animation:fade .18s}
.viewer .ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#67707E;font-size:13px;line-height:1.8}
.tabbar{flex:0 0 auto;height:60px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;position:relative;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;color:#9AA3AE;transition:.15s;position:relative}
.tab.on{color:var(--brand)}
.tab svg{width:23px;height:23px}
.tab span{font-size:10.5px;font-weight:500}
.tab .dot{position:absolute;top:9px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;
  background:var(--red);border:1.5px solid #fff}
.phone.big .screen{zoom:1.14}
/* ============ 首页卡片拖拽 ============ */
.card.dragging{position:relative;z-index:99;touch-action:none;transition:none;
  box-shadow:0 16px 38px rgba(16,24,40,.26);cursor:grabbing}
/* ============ 紧凑紧急卡 ============ */
.card.emg-row{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;
  background:linear-gradient(140deg,#fff,#FFF7F7);border:1.5px solid #FBD5D5}
.card.emg-row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:#FDE8E8;color:#B91C1C;flex:0 0 auto}
.card.emg-row .tx{flex:1;min-width:0}
.card.emg-row .tx b{font-size:14.5px;display:block}
.card.emg-row .tx span{font-size:11.5px;color:#C97B7B;display:block;margin-top:3px}
.card.emg-row .go{color:#E5B4B4;font-size:17px}
/* ============ 行内操作 ============ */
.acts{float:right;display:flex;gap:10px}
.acts span{font-size:11.5px;cursor:pointer;color:var(--brand-3)}
.acts span.del{color:#DC2626}
/* ============ 短期用药 ============ */

function pad(n){ return String(n).padStart(2,'0'); }
function fmtMD(d){ return d ? String(d).slice(5).replace('-','.') : ''; }
function calcAge(birth){
  if(!birth) return '';
  const [y,mo,d] = birth.split('-').map(Number);
  const [ry,rm,rd] = TODAY.split('-').map(Number);
  let a = ry - y;
  if(rm < mo || (rm===mo && rd<d)) a--;
  return a;
}
function nowStr(){
  const d = new Date();
  return `${d.getMonth()+1}.${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function uid(p){ return p + Math.random().toString(36).slice(2,7); }
function toast(msg, ms=1500){

/* ============================================================================

let OV_TOKEN = 0;
function openOverlay(html){
  OV_TOKEN++;
  $('overlay').innerHTML = `<div class="phone-inner">${html}</div>`;
  $('fab-slot').innerHTML = '';
}
function closeOverlay(){
  $('overlay').innerHTML = '';
  $('fab-slot').innerHTML = state.tab==='tl' ? '<div class="fab" onclick="openAddMenu()">＋</div>' : '';
}
function openActions(items){
  const box = document.createElement('div');
  box.className = 'actions';
  box.innerHTML = `<div class="box">
    ${items.map((it,i)=>`<div class="it ${it.danger?'danger':''}" data-i="${i}">${it.t}</div>`).join('')}
    <div class="it cancel" data-i="-1">取消</div></div>`;
  box.addEventListener('click', e=>{
    const t = e.target.closest('.it'); if(!t) return;
    const i = +t.dataset.i;
    box.remove();
    if(i>=0) items[i].fn();
  });
  $('phone').appendChild(box);
}
function confirmBox(msg, onOk){
  openActions([{ t: msg, fn:onOk }, { t:'取消', fn:()=>{} }]);
}
function openViewer(label){
  const v = document.createElement('div');
  v.className = 'viewer';
  v.innerHTML = `<div class="ph">${label||'照片附件'}
    <span style="font-size:11px;color:#4A5260">云存储私有文件 · 云函数换取临时链接</span>
    <span style="font-size:11px;color:#4A5260">点击任意处关闭</span></div>`;
  v.onclick = () => v.remove();
  $('phone').appendChild(v);
}

let FV = {}, FORM = null;
function openForm(cfg, onOk){
  FV = {};
  (cfg.fields||[]).forEach(f=>{ FV[f.k] = f.val!==undefined ? f.val : (f.t==='chips' ? (f.single?'':[]) : ''); });
  FORM = { cfg, onOk };
  drawForm();
}
function drawForm(){
  const cfg = FORM.cfg;
  openOverlay(`
    ${navOverlay(cfg.title, 'closeOverlay()')}
    <div class="sheet-body" style="max-height:none;flex:1;border-radius:0">
      <div class="sheet-bd">
        ${cfg.tip ? `<div class="muted" style="margin-bottom:14px;line-height:1.6">${cfg.tip}</div>` : ''}
        ${cfg.fields.map(f=>{
          const v = FV[f.k];
          let ctl = '';
          if(f.t==='chips'){
            const on = x => f.single ? v===x : (v||[]).includes(x);
            ctl = `<div class="opts">${f.opts.map(o=>`<div class="opt ${on(o)?'on':''}"
              onclick="togChip('${f.k}','${o}',${f.single?1:0})">${o}</div>`).join('')}</div>`;
          } else if(f.t==='textarea'){
            ctl = `<textarea placeholder="${f.ph||''}" oninput="FV['${f.k}']=this.value">${v||''}</textarea>`;
          } else {
            const ty = f.t==='num' ? 'tel' : f.t==='date' ? 'date' : 'text';
            ctl = `<input type="${ty}" placeholder="${f.ph||''}" value="${v||''}"
              ${f.ro?'readonly style="background:#F7F9FB;color:#9CA3AF"':''}
              oninput="FV['${f.k}']=this.value"/>`;
          }
          return `<div class="fld"><label>${f.l}${f.req?' <span class="req">*</span>':''}</label>${ctl}
            ${f.hint?`<div class="muted" style="margin-top:6px;line-height:1.5">${f.hint}</div>`:''}</div>`;
        }).join('')}
      </div>
      <div class="sheet-ft">
        <div class="btn ghost" style="flex:1" onclick="closeOverlay()">取消</div>
        <div class="btn primary" style="flex:1.6" onclick="submitForm()">${cfg.submit||'保存'}</div>
      </div>
    </div>`);
}
function togChip(k, o, single){
  if(single){ FV[k] = (FV[k]===o) ? '' : o; }
  else {
    const a = FV[k] || [];
    const i = a.indexOf(o);
    if(i>=0) a.splice(i,1); else a.push(o);
    FV[k] = a;
  }
  drawForm();
}
function submitForm(){
  const cfg = FORM.cfg, onOk = FORM.onOk;
  for(const f of cfg.fields){
    if(f.req){
      const v = FV[f.k];
      if(!v || (Array.isArray(v) && !v.length)){ toast('请填写：' + f.l); return; }
    }
  }
  const before = OV_TOKEN;
  if(onOk(FV) === false) return;
  // onOk 内部若已打开新页面（如回到档案页），不要再关掉它
  if(OV_TOKEN !== before) return;
  closeOverlay();
}

/* ---- 长按拖拽排序 ---- */
let DRAG = null, PRESS = null, BLOCK_CLICK = false;
function cardDown(e, key){
  if(e.button !== undefined && e.button !== 0) return;
  const el = e.currentTarget;
  const y0 = e.clientY;
  const cancel = ()=>{
    clearTimeout(PRESS);
    document.removeEventListener('pointermove', cancel);
  };
  document.addEventListener('pointermove', cancel);
  PRESS = setTimeout(()=>{
    DRAG = { el, key, grabY: y0 - el.getBoundingClientRect().top };
    el.classList.add('dragging');
    toast('拖动调整卡片顺序，松手放置', 1400);
    document.addEventListener('pointermove', cardMove);
    document.addEventListener('pointerup', cardUp, { once:true });
  }, 380);
}
function cardMove(e){
  if(!DRAG) return;
  if(e.cancelable) e.preventDefault();
  const el = DRAG.el;
  const t = e.clientY - DRAG.grabY - el.offsetTop;
  el.style.transform = 'translateY(' + t + 'px) scale(1.015)';
  const sibs = [...el.parentNode.children].filter(x=> x!==el && x.hasAttribute('data-card'));
  const mid = el.offsetTop + t + el.offsetHeight/2;
  for(const s of sibs){
    const sMid = s.offsetTop + s.offsetHeight/2;
    const elFollowsS = !!(el.compareDocumentPosition(s) & Node.DOCUMENT_POSITION_FOLLOWING);
    if(mid < sMid && elFollowsS){ el.parentNode.insertBefore(el, s); break; }
    if(mid > sMid && !elFollowsS){ el.parentNode.insertBefore(s, el); break; }
  }
}
function cardUp(){
  if(!DRAG) return;
  const el = DRAG.el;
  el.style.transform = '';
  el.classList.remove('dragging');
  document.removeEventListener('pointermove', cardMove);
  const keys = [...el.parentNode.children]
    .filter(x=>x.hasAttribute('data-card')).map(x=>x.dataset.card);
  state.order = keys;
  DRAG = null;
  BLOCK_CLICK = true;
  setTimeout(()=>{ BLOCK_CLICK = false; }, 320);
  toast('顺序已保存', 1000);
}
document.addEventListener('click', e=>{
  if(BLOCK_CLICK){ e.stopPropagation(); e.preventDefault(); }
}, true);

function delItem(pid, key, name){
  confirmBox('确认删除「' + name + '」？', ()=>doDelItem(pid, key, name));
}
function doDelItem(pid, key, name){
  const p = P(pid);
  if(!p[key]) return;
  p[key] = p[key].filter(x=>x.n!==name);
  log('删除档案项', p.name + ' · ' + name, '删');
  renderTabbar();
  if(ITEM_BACK === 'emergency') openEmergency(pid); else openArchive(pid);
  toast('已删除');
}

    ]}
};
const SLOT_MAP = { '早':'morning','中':'noon','晚':'evening','睡前':'bedtime' };
function medFromForm(v){
  return { n:v.n, sp:v.sp, dos:v.dos, fq:v.fq,
    slots:(Array.isArray(v.slots)?v.slots:[v.slots]).map(x=>SLOT_MAP[x]).filter(Boolean),
    start:v.start || '', end:v.end || '' };
}
function maskPhone(s){
  s = String(s || '');
  return /^\d{11}$/.test(s) ? s.replace(/(\d{3})\d{4}(\d{2})/, '$1****$2') : s;
}
function itemCopy(key){ return JSON.parse(JSON.stringify(ITEM_CFG[key])); }

function addItem(pid, key){
  openForm(itemCopy(key), v=>{
    const p = P(pid);
    if(!p[key]) p[key] = [];
    if(key==='allergy')  p.allergy.push({ n:v.n, ty:v.ty, sev:v.sev, rx:v.rx });
    if(key==='chronic')  p.chronic.push({ n:v.n, d:v.d });
    if(key==='surgery')  p.surgery.push({ n:v.n, d:v.d, h:v.h });
    if(key==='meds')     p.meds.push(medFromForm(v));
    if(key==='contacts') p.contacts.push({ n:v.n, rel:v.rel, phone:maskPhone(v.phone), pr:p.contacts.length+1 });
    log('添加档案项', p.name + ' · ' + v.n, '添');
    renderTabbar();
    if(ITEM_BACK === 'emergency') openEmergency(pid); else openArchive(pid);
    toast('已保存');
  });
}
let ITEM_BACK = 'archive';
function editItem(pid, key, name){
  const p = P(pid);
  const item = (p[key] || []).find(x=>x.n===name);
  if(!item){ toast('找不到这条记录'); return; }
  const cfg = itemCopy(key);
  cfg.title = cfg.title.replace('添加', '编辑');
  cfg.submit = '保存';
  cfg.tip = key==='meds'
    ? '结束日期留空 = 长期服用；填了就是短期药，到期后从首页移除。'
    : (cfg.tip || '');
  cfg.fields.forEach(f=>{
    if(f.k === 'slots') f.val = (item.slots || []).map(s=>SLOT[s]).filter(Boolean);
    else if(item[f.k] !== undefined) f.val = item[f.k];
  });
  openForm(cfg, v=>{
    if(key==='allergy')  Object.assign(item, { n:v.n, ty:v.ty, sev:v.sev, rx:v.rx });
    if(key==='chronic')  Object.assign(item, { n:v.n, d:v.d });
    if(key==='surgery')  Object.assign(item, { n:v.n, d:v.d, h:v.h });
    if(key==='meds')     Object.assign(item, medFromForm(v));
    if(key==='contacts') Object.assign(item, { n:v.n, rel:v.rel, phone:maskPhone(v.phone) });
    log('修改档案项', p.name + ' · ' + v.n, '改');
    renderTabbar();
    if(ITEM_BACK === 'emergency') openEmergency(pid); else openArchive(pid);
    toast('已保存');
  });
}
function openPersonPicker(key){
  if(!DB.persons.length) return openPersonForm();
  openActions(DB.persons.map(p=>({
    t:'给「' + p.name + '」添加' + (key==='meds' ? '用药' : '记录'),
    fn:()=>addItem(p.id, key)
  })).concat([{ t:'添加新成员', fn:()=>openPersonForm() }]));
}

function approve(id, ok){
  const i = DB.pending.findIndex(x=>x.id===id);
  const q = DB.pending[i];
  if(ok){
    DB.persons.push({
      id: uid('p'), name:q.name, rel:q.rel, sex:'未知', birth:'', blood:'未知',
      color:'#8B93A1', ini:q.name.slice(-1), ptype:'self', custodian:'', consent:'',
      allergy:[], chronic:[], surgery:[], meds:[],
      contacts:[{ n:q.name, rel:'本人', phone:q.phone, pr:1 }]
    });
    log('同意加入家庭', q.name + '（' + q.rel + '）', '人');
    toast('已同意 ' + q.name + ' 加入');
  } else {
    log('拒绝加入申请', q.name, '拒');
    toast('已拒绝');
  }
  DB.pending.splice(i,1);
  render();
}
function openPersonForm(pid){

      { k:'ptype', l:'档案类型', t:'chips', single:true, req:true, opts:['本人档案','代管档案'],

      { k:'consent', l:'代管授权', t:'chips', single:true, opts:['已获本人（或监护人）同意'], val:'' }
    ]
  }, v=>{

      consent: v.consent ? nowStr() + ' 已获本人同意' : '',

    };
    if(data.ptype==='managed' && !data.consent){ toast('代管档案必须勾选已获同意'); return false; }
    if(p){
      if(p.consent && !data.consent) data.consent = p.consent;
      Object.assign(p, data);
      log('修改成员信息', v.name, '改');
    } else {
      DB.persons.push(Object.assign({
        id:uid('p'), color:'#8B93A1', ini:(v.name||'?').slice(-1),
        allergy:[], chronic:[], surgery:[], meds:[], contacts:[]
      }, data));
      log('添加成员', v.name + '（' + v.rel + '）', '人');

    render();

    toast('已保存');

function doExport(){
  const blob = JSON.stringify({
    exported_at: nowStr(), family:DB.family, persons:DB.persons,
    events:DB.events, conditions:DB.conditions, todos:DB.todos
  }, null, 2);
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([blob], { type:'application/json' }));
    a.download = 'family-health-' + TODAY + '.json';
    a.click();
  }catch(e){}
  log('导出数据', '全量 JSON', '导');
  toast('已导出 JSON（' + Math.round(blob.length/1024) + ' KB）', 1800);
}

let REC = {};
function openRecord(){
  REC = { step:1, pid: state.person==='all' ? (DB.persons[0]||{}).id : state.person,
    symptom:'', start:'2026-10-14', days:[{ d:'10.13', s:'', m:'' }], ended:null };
  drawRecord();
}
function drawRecord(){
  const s = REC.step;
  const bar = `<div class="steps-bar"><i class="${s>=1?'on':''}"></i><i class="${s>=2?'on':''}"></i><i class="${s>=3?'on':''}"></i></div>`;
  let title = '', body = '', foot = '';

  if(s===1){
    title = '补记 · 这次是什么？';
    body = `
      <div class="fld"><label>给谁记</label>
        <div class="opts">${DB.persons.map(p=>`<div class="opt ${REC.pid===p.id?'on':''}"
          onclick="REC.pid='${p.id}';drawRecord()">${p.name}</div>`).join('')}</div></div>
      <div class="fld"><label>症状 / 病程名称 <span class="req">*</span></label>
        <div class="opts">${['咳嗽','发热','腹泻','咽痛','头痛','皮疹','其他'].map(x=>
          `<div class="opt ${REC.symptom===x?'on':''}"
            onclick="REC.symptom='${x}';drawRecord()">${x}</div>`).join('')}</div></div>
      <div class="fld"><label>开始日期（可回溯，默认昨天）</label>
        <input type="date" value="${REC.start}" oninput="REC.start=this.value"
          style="width:100%;border:1px solid #E4E8ED;border-radius:10px;padding:10px 12px;
          font-size:14px;font-family:inherit;outline:none;background:#fff"/>
        <div class="muted" style="margin-top:7px;line-height:1.6">
          补记模式：occurred_at（实际发生）与 recorded_at（今天补录）分开存储</div></div>`;
    foot = `<div class="btn primary" style="flex:1" onclick="nextRec(1)">下一步</div>`;
  }

  if(s===2){
    title = '补记 · 逐日填写';
    body = `
      <div class="muted" style="margin-bottom:12px;line-height:1.6">
        一次把几天补完 · 允许某天留空（空也是有价值的信息）</div>
      ${REC.days.map((d,i)=>`
        <div style="border:1px solid #EEF1F4;border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#FCFDFE">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <b style="font-size:13px">${d.d}</b><span class="muted">第 ${i+1} 天</span></div>
          <input placeholder="症状（如 咳嗽 轻 / 无）" value="${d.s}"
            oninput="REC.days[${i}].s=this.value"
            style="width:100%;border:1px solid #E4E8ED;border-radius:9px;padding:9px 11px;
            font-size:13.5px;margin-bottom:7px;font-family:inherit;outline:none"/>
          <input placeholder="用药 / 体温 / 备注" value="${d.m}"
            oninput="REC.days[${i}].m=this.value"
            style="width:100%;border:1px solid #E4E8ED;border-radius:9px;padding:9px 11px;
            font-size:13.5px;font-family:inherit;outline:none"/>
        </div>`).join('')}
      <div class="addline" onclick="addDay()">＋ 添加一天</div>`;
    foot = `<div class="btn ghost" style="flex:1" onclick="REC.step=1;drawRecord()">上一步</div>
            <div class="btn primary" style="flex:1.6" onclick="nextRec(2)">下一步</div>`;
  }

  if(s===3){
    title = '补记 · 结束了吗？';
    body = `
      <div class="fld"><label>本次病程状态 <span class="req">*</span></label>
        <div class="opts">
          <div class="opt ${REC.ended===false?'on':''}" onclick="REC.ended=false;drawRecord()">还在继续</div>
          <div class="opt ${REC.ended===true?'on':''}"  onclick="REC.ended=true;drawRecord()">已结束</div>
        </div></div>
      <div style="background:#F9FBFC;border-radius:12px;padding:12px 14px">
        <div class="kv"><div class="k">成员</div><div class="v"><b>${(P(REC.pid).name)||'—'}</b></div></div>
        <div class="kv"><div class="k">病程</div><div class="v"><b>${REC.symptom||'咳嗽'}</b></div></div>
        <div class="kv"><div class="k">开始</div><div class="v">${REC.start}</div></div>
        <div class="kv"><div class="k">记录</div><div class="v">${REC.days.length} 天</div></div>
        <div class="kv"><div class="k">状态</div><div class="v">${REC.ended===null?'未选择':REC.ended?'已结束':'进行中'}</div></div>
      </div>
      <div class="muted" style="margin-top:12px;line-height:1.7">
        提交后写入 condition + timeline_event，并出现在健康时间线顶部</div>`;
    foot = `<div class="btn ghost" style="flex:1" onclick="REC.step=2;drawRecord()">上一步</div>
            <div class="btn primary" style="flex:1.6" onclick="submitRec()">保存补记</div>`;
  }

  openOverlay(`
    <div class="navbar"><div class="title">${title}</div>${capsule()}</div>
    <div class="sheet-body" style="max-height:none;flex:1;border-radius:0">
      ${bar}<div class="sheet-bd">${body}</div><div class="sheet-ft">${foot}</div>
    </div>`);
}
function nextRec(from){
  if(from===1 && !REC.symptom){ toast('请选择症状'); return; }
  if(from===2){ REC.step = 3; REC.ended = null; } else REC.step = from+1;
  drawRecord();
}
function addDay(){
  const l = REC.days[REC.days.length-1].d.split('.');
  let mm = +l[0], dd = +l[1] + 1;
  if(dd>31){ dd=1; mm++; }
  REC.days.push({ d: pad(mm)+'.'+pad(dd), s:'', m:'' });
  drawRecord();
}
function submitRec(){
  if(REC.ended===null){ toast('请选择是否已结束'); return; }
  const cid = uid('c');
  const evs = REC.days.map(d=>({
    date: '2026-' + d.d.replace('.','-'), time:'',
    type: d.s ? 'symptom' : 'empty',
    text: d.s || d.m || '—（无记录）', sev:1, sevT:''
  }));
  const meds = REC.days.map(d=>d.m).filter(x=> x && /服用|药/.test(x));
  DB.conditions[cid] = {
    pid: REC.pid, title: REC.symptom || '不适', start: REC.start,
    ongoing: !REC.ended, events: evs,
    medSummary: meds.length ? meds.join(' / ') : '—', visited:'未就诊'
  };
  DB.events.unshift({
    id: uid('e'), pid: REC.pid, type:'condition', title: REC.symptom || '不适',
    ongoing: !REC.ended, date: REC.start,
    sub: REC.start.slice(5).replace('-','.') + ' 起 · ' + REC.days.length + ' 天',
    ref: cid
  });
  log('新增补记', ((P(REC.pid).name)||'') + ' · ' + (REC.symptom||'不适'), '记');
  closeOverlay(); render();
  toast('补记已保存，已出现在健康时间线');
}

/* ============================================================================
   14. 记录就诊 / 检查 / 疫苗 / 待办
   ============================================================================ */
function personField(){
  const cur = state.person==='all' ? '' : (P(state.person).name || '');
  return { k:'pid', l:'给谁记', t:'chips', single:true, req:true,
    opts: DB.persons.map(p=>p.name),
    val: cur || ((DB.persons[0]||{}).name || '') };
}
function pidByName(n){ const p = DB.persons.find(x=>x.name===n); return p ? p.id : (DB.persons[0]||{}).id; }

function openVisitForm(){
  openForm({ title:'记录就诊', submit:'保存',
    fields:[ personField(),
      { k:'date', l:'就诊日期', t:'date', val:TODAY, req:true },
      { k:'hospital', l:'医院', t:'text', req:true, ph:'如 市第一人民医院' },
      { k:'dept', l:'科室', t:'text', ph:'如 呼吸内科' },
      { k:'vtype', l:'就诊类型', t:'chips', single:true, opts:['门诊','急诊','住院','复诊'], val:'门诊' },
      { k:'doctor', l:'医生（可空）', t:'text' },
      { k:'diag', l:'医生诊断（照抄医生原话）', t:'textarea',
        hint:'系统不会自动生成任何诊断，此处只记录医生说的话' },
      { k:'advice', l:'医嘱（可空）', t:'text' }
    ]}, v=>{
      DB.events.unshift({ id:uid('e'), pid:pidByName(v.pid), type:'visit',
        title: v.hospital + (v.dept ? ' · ' + v.dept : ''), date:v.date,
        sub: v.vtype + (v.diag ? ' · 医生记录：' + v.diag.slice(0,14) : '') });
      log('新增就诊记录', v.pid + ' · ' + v.hospital, '添');
      render(); toast('就诊记录已保存');
    });
}
function openExamForm(){
  openForm({ title:'记录检查 / 体检', submit:'保存',
    fields:[ personField(),
      { k:'rtype', l:'报告类型', t:'chips', single:true, req:true,
        opts:['化验','影像','体检','其他'], val:'化验',
        hint:'类型决定它在时间线上显示为「检查」还是「体检」' },
      { k:'name', l:'项目名称', t:'text', req:true, ph:'如 血常规 / 胸部 CT / 年度体检' },
      { k:'date', l:'检查日期', t:'date', val:TODAY, req:true },
      { k:'hospital', l:'医院 / 机构', t:'text' },
      { k:'summary', l:'结论摘要（可空）', t:'textarea', ph:'手填或二期 OCR 提取' }
    ]}, v=>{
      DB.events.unshift({ id:uid('e'), pid:pidByName(v.pid),
        type: v.rtype==='体检' ? 'checkup' : 'exam',
        title:v.name, date:v.date, sub: v.summary || v.hospital || '见报告' });
      log('新增检查报告', v.pid + ' · ' + v.name, '添');
      render(); toast('检查记录已保存');
    });
}
function openVaccineForm(){
  openForm({ title:'记录疫苗', submit:'保存',
    fields:[ personField(),
      { k:'name', l:'疫苗名称', t:'text', req:true, ph:'如 流感疫苗' },
      { k:'dose', l:'针次', t:'chips', single:true, opts:['第 1 针','第 2 针','第 3 针','加强针'], val:'第 1 针' },
      { k:'date', l:'接种日期', t:'date', val:TODAY, req:true },
      { k:'inst', l:'接种机构', t:'text' },
      { k:'next', l:'下一针日期（可空）', t:'date', hint:'填写后会自动生成一条待办' }
    ]}, v=>{
      const pid = pidByName(v.pid);
      DB.events.unshift({ id:uid('e'), pid, type:'vaccine',
        title: v.name + ' · ' + v.dose, date:v.date, sub: v.inst || '社区卫生服务中心' });
      if(v.next) DB.todos.unshift({ id:uid('t'), pid, title: v.name + ' · 下一针',
        due: v.next.slice(5), cls:'ok', note:'自动生成', done:false });
      log('新增疫苗记录', v.pid + ' · ' + v.name, '添');
      render(); toast('疫苗记录已保存' + (v.next ? '，并生成待办' : ''));
    });
}
function openTodoForm(){
  openForm({ title:'添加待办', submit:'保存', tip:'一期无推送，待办只在首页站内展示',
    fields:[ personField(),
      { k:'type', l:'类型', t:'chips', single:true, req:true,
        opts:['复查','疫苗','体检','自定义'], val:'复查' },
      { k:'title', l:'事项', t:'text', req:true, ph:'如 呼吸内科复查' },
      { k:'date', l:'日期', t:'date', val:TODAY, req:true },
      { k:'ahead', l:'提前几天在首页高亮', t:'chips', single:true, opts:['1 天','3 天','7 天'], val:'3 天' },
      { k:'note', l:'备注（可空）', t:'text' }
    ]}, v=>{
      DB.todos.unshift({ id:uid('t'), pid:pidByName(v.pid), title:v.title,
        due:v.date.slice(5), cls:'ok', note: v.note || (v.ahead + '提醒'), done:false });
      log('添加待办', v.pid + ' · ' + v.title, '添');
      render(); toast('待办已添加');
    });
}

/* ============================================================================
   15. 启动
   ============================================================================ */
function tick(){
  const d = new Date();
  $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
}
tick(); setInterval(tick, 20000);
render();
</script>
</body>
</html>
